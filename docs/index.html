<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microfold</title>
<link rel="icon" type="image/svg+xml" href="microfold.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.4/build/3Dmol-min.js"></script>
<style>
:root {
  --bg-0: #f7f5ef;
  --fg: #15171a;
  --muted: #6a6a66;
  --rule: rgba(0,0,0,0.08);
  --accent: #5b6f8a;
  --accent-2: #9c7474;

  --truth: #6f9c7a;
  --pred:  #b56a8a;

  /* High-contrast element palette (truth set). Pred set keeps O/N/S identical, only carbon flips. */
  --elem-c-truth: #6f9c7a;
  --elem-c-pred:  #b56a8a;
  --elem-n: #3f5fa7;
  --elem-o: #c2453a;
  --elem-s: #c89a30;
  --elem-h: #c8c4ba;

  --header-h: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-0); color: var(--fg);
  font-family: 'EB Garamond', 'Latin Modern Roman', 'Cambria', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "liga","kern","onum";
  font-size: 18px; line-height: 1.4;
}
body {
  background:
    radial-gradient(ellipse at 20% 10%, rgba(91,111,138,0.04), transparent 55%),
    radial-gradient(ellipse at 80% 70%, rgba(156,116,116,0.03), transparent 55%),
    var(--bg-0);
  min-height: 100vh;
}

.brand {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: baseline;
  height: var(--header-h);
  padding: 8px 28px;
  background: linear-gradient(180deg, rgba(247,245,239,0.96) 0%, rgba(247,245,239,0) 100%);
  backdrop-filter: blur(8px);
}
.brand .logo { font-style: italic; font-weight: 500; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand .logo img { height: 22px; width: auto; display: block; }
.brand .epoch { font-style: italic; font-size: 12px; color: var(--muted); }
.brand .epoch b { font-style: normal; font-weight: 600; color: var(--accent); }

.hero {
  height: 100vh; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 140px 24px 80px; position: relative;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
.hero .kicker { font-style: italic; font-size: 16px; color: var(--muted); margin-bottom: 22px; }
.hero .mark { display: block; margin: 0 auto 18px; width: clamp(90px, 6vw, 170px); height: auto; }
.hero h1 {
  font-size: clamp(80px, 16vw, 240px); font-weight: 500;
  font-style: italic; line-height: 0.92; letter-spacing: -0.02em;
}
.hero .tagline { margin-top: 56px; font-size: 19px; max-width: 620px; color: var(--muted); line-height: 1.55; }
.hero .agg { margin-top: 64px; display: grid; grid-template-columns: repeat(4, minmax(120px,1fr)); gap: 36px; }
.hero .agg .stat .v { font-size: 32px; font-style: italic; color: var(--accent); font-weight: 500; }
.hero .agg .stat .l { font-size: 12px; font-style: italic; color: var(--muted); margin-top: 4px; }
.hero .scroll-hint {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
  font-style: italic; font-size: 13px; color: var(--muted);
  animation: bob 2.4s ease-in-out infinite;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.hint {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  z-index: 30;
  font-style: italic; font-size: 12px; color: var(--muted);
  display: flex; gap: 14px; align-items: center;
  padding: 6px 14px; border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(247,245,239,0.7); backdrop-filter: blur(6px);
  pointer-events: none;
  opacity: 0; transition: opacity 0.3s ease;
}
.hint.show { opacity: 1; }
.hint kbd {
  font-family: 'JetBrains Mono', monospace; font-style: normal;
  font-size: 11px; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 4px;
  background: rgba(255,255,255,0.5);
}
@keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(6px); } }

/* Each peptide is one full-screen scroll slot — but its visible content is rendered
   by the single fixed .stage element below, driven by scroll position.            */
.peptides { position: relative; scroll-snap-type: y mandatory; }
.peptide {
  height: 100vh;
  position: relative;
  scroll-snap-align: center;
  scroll-snap-stop: always;
}
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }

/* The stage holds BOTH the metrics card and the viewer. They animate together as
   one unit, sliding up from below the fold. The whole stage sits between header
   bottom and viewport bottom and scales/dims with scroll proximity.              */
.stage {
  --stage-py: clamp(12px, 2vh, 24px);
  --stage-px: clamp(20px, 4vw, 64px);
  position: fixed;
  left: 0; right: 0;
  top: var(--header-h);
  bottom: 0;
  z-index: 5;
  pointer-events: none;
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.1fr);
  gap: clamp(20px, 4vw, 80px);
  padding: var(--stage-py) var(--stage-px);
  align-items: center;
  /* shared animation driven from JS via these CSS vars */
  transform: translateY(var(--st-ty, 24px)) scale(var(--st-scl, 0.94));
  opacity: var(--st-opa, 0.0);
  filter: blur(var(--st-blur, 6px));
  transition: transform 0.25s ease, opacity 0.25s ease, filter 0.25s ease;
  transform-origin: center center;
}
.stage.hidden { display: none; }
.stage.flip { grid-template-columns: minmax(320px, 1.1fr) minmax(320px, 1fr); }
.stage.flip .card-side { order: 2; justify-self: end; }
.stage.flip .viewer-side { order: 1; }

/* metrics + title side */
.card-side {
  pointer-events: auto;
  width: 100%;
  max-width: min(560px, 42vw);
  display: flex; flex-direction: column; gap: clamp(12px, 1.6vh, 24px);
}
.card-side .index { font-style: italic; color: var(--muted); font-size: 14px; }
.card-side .title {
  font-size: clamp(40px, 6.5vw, 88px); font-weight: 500; line-height: 1.0;
  letter-spacing: -0.015em; font-style: italic;
}
.card-side .subtitle { color: var(--muted); font-size: 15px; font-style: italic; }
.card-side .metrics {
  display: grid; grid-template-columns: repeat(2,1fr);
  border-top: 1px solid var(--rule); margin-top: 4px;
}
.card-side .metric {
  padding: 12px 0; border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: baseline;
}
.card-side .metric:nth-child(odd)  { border-right: 1px solid var(--rule); padding-right: 20px; }
.card-side .metric:nth-child(even) { padding-left: 20px; }
.card-side .metric .label { font-style: italic; font-size: 14px; color: var(--muted); }
.card-side .metric .value { font-size: clamp(18px, 1.6vw, 22px); font-weight: 500; font-feature-settings: "tnum","lnum"; }
.card-side .metric.rmsd .value { color: var(--accent); }
.card-side .metric.fape .value { color: var(--accent-2); }
.card-side .seq-card { border-top: 1px solid var(--rule); padding-top: 12px; }
.card-side .seq-card .label { font-style: italic; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.card-side .seq-card .seq {
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
  letter-spacing: 0.08em; word-break: break-all;
}

/* viewer side — square that fits inside the stage row without overflowing. */
.viewer-side {
  position: relative;
  pointer-events: auto;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.viewer-frame {
  position: relative;
  /* min(width-cap, height-cap) keeps it square AND inside the row. */
  width: min(100%, calc((100vh - var(--header-h) - 2 * var(--stage-py, 24px))));
  height: min(100%, calc((100vh - var(--header-h) - 2 * var(--stage-py, 24px))));
  aspect-ratio: 1 / 1;
}
.viewer-frame .canvas { width: 100%; height: 100%; pointer-events: none; }
.viewer-frame.unlocked .canvas { pointer-events: auto; }

.viewer-toggle {
  position: absolute; top: 8px; left: 12px;
  font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px;
  color: var(--muted); cursor: pointer; user-select: none;
  padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(247,245,239,0.7); backdrop-filter: blur(6px);
  z-index: 10;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.viewer-toggle:hover { color: var(--fg); border-color: var(--muted); }
.viewer-frame.unlocked .viewer-toggle { color: var(--accent); border-color: var(--accent); }

/* Combined legend: structure (truth/pred) + element colours. */
.legend {
  position: absolute; top: 8px; right: 12px;
  display: flex; flex-direction: column; gap: 6px;
  font-style: italic; font-size: 12px; color: var(--muted);
  padding: 8px 12px; border: 1px solid var(--rule); border-radius: 10px;
  background: rgba(247,245,239,0.7); backdrop-filter: blur(6px);
  z-index: 9;
  max-width: 180px;
}
.legend .group { display: flex; flex-direction: column; gap: 3px; }
.legend .group + .group { border-top: 1px solid var(--rule); padding-top: 6px; }
.legend .row { display: flex; align-items: center; gap: 6px; }
.legend .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend .swatch.truth { background: var(--truth); }
.legend .swatch.pred  { background: var(--pred); }
.legend .swatch.c-t   { background: var(--elem-c-truth); }
.legend .swatch.c-p   { background: var(--elem-c-pred); }
.legend .swatch.n     { background: var(--elem-n); }
.legend .swatch.o     { background: var(--elem-o); }
.legend .swatch.s     { background: var(--elem-s); }

.controls {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  display: flex; pointer-events: auto;
}
.controls button {
  background: transparent; border: 0; color: var(--muted);
  font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px;
  padding: 6px 14px; cursor: pointer; border-right: 1px solid var(--rule);
}
.controls button:last-child { border-right: 0; }
.controls button:hover { color: var(--fg); }
.controls button.active { color: var(--accent); font-weight: 600; font-style: normal; }

.outro {
  height: 100vh; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; font-style: italic; font-size: 14px; color: var(--muted);
  scroll-snap-align: end;
  scroll-snap-stop: always;
}
.outro hr { width: 60px; margin: 14px auto; border: 0; border-top: 1px solid var(--rule); }

.loader {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg-0); z-index: 200; font-style: italic; color: var(--muted); font-size: 14px;
  transition: opacity 0.4s ease;
}
.loader.gone { opacity: 0; pointer-events: none; }

/* Portrait / narrow screens: stack vertically (title on top, viewer on bottom),
   but keep the fixed-stage scroll-driven animation and snap-scrolling so each
   peptide is its own page that snaps into view. */
@media (max-width: 900px), (orientation: portrait) {
  :root { --header-h: 44px; }

  .hero {
    height: 100svh;
    padding: 96px 20px 96px;
    justify-content: flex-start;
    padding-top: 22svh;
  }
  .hero h1 { font-size: clamp(72px, 22vw, 140px); }
  .hero .tagline { margin-top: 28px; font-size: 16px; }
  .hero .agg {
    margin-top: 36px;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 18px 28px;
  }
  .hero .agg .stat .v { font-size: 24px; }
  .hero .scroll-hint { bottom: 24px; font-size: 12px; }

  /* Each peptide slot is still one viewport tall — the fixed stage renders it. */
  .peptide { height: 100svh; }
  .outro { height: 100svh; }

  /* Single-column stage: title block on top, viewer block on bottom.
     Stage stays fixed so the JS-driven slide/fade between peptides still works. */
  .stage {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: clamp(10px, 2vh, 18px);
    padding: clamp(8px, 1.5svh, 16px) clamp(16px, 5vw, 28px) clamp(16px, 3svh, 28px);
    align-items: stretch;
    align-content: start;
  }
  /* Disable left/right flip on mobile — keep title above viewer always. */
  .stage.flip { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .stage.flip .card-side  { order: 0; justify-self: stretch; }
  .stage.flip .viewer-side { order: 1; }

  .card-side {
    max-width: 100%;
    gap: 8px;
  }
  .card-side .title { font-size: clamp(34px, 9vw, 58px); }
  .card-side .subtitle { font-size: 13px; }
  .card-side .metrics { display: none; }
  .card-side .seq-card { padding-top: 8px; }
  .card-side .seq-card .label { margin-bottom: 4px; font-size: 12px; }
  .card-side .seq-card .seq { font-size: 12px; }

  .viewer-side {
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .viewer-frame {
    /* Square that fits inside the remaining row, capped to viewport width. */
    width: min(100%, calc(100svh - var(--header-h) - 220px));
    height: min(100%, calc(100svh - var(--header-h) - 220px));
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
  }
  .legend { font-size: 10px; padding: 6px 8px; max-width: 130px; }
  .legend .swatch { width: 7px; height: 7px; }
  .viewer-toggle { font-size: 11px; padding: 4px 9px; }
  .controls button { font-size: 12px; padding: 4px 10px; }

  .hint { display: none; }
}
</style>
</head>
<body>

<div class="loader" id="loader">building view…</div>

<header class="brand">
  <div class="logo"><img src="microfold.svg" alt=""> microfold</div>
  <div class="epoch" id="brand-epoch"></div>
</header>

<section class="hero">
  <div class="kicker">geometric deep learning &middot; peptide backbone prediction</div>
  <h1>microfold</h1>
  <p class="tagline" id="hero-tagline"></p>
  <div class="agg" id="hero-agg"></div>
  <div class="scroll-hint">scroll &darr;</div>
</section>

<div class="hint" id="navHint">
  <span>scroll <kbd>&darr;</kbd></span>
  <span>or <kbd>&larr;</kbd> <kbd>&rarr;</kbd></span>
</div>

<!-- One stage = one component containing both the metrics card and the viewer.
     They share the same translateY/scale/opacity animation. -->
<div class="stage hidden" id="stage">
  <div class="card-side" id="cardSide"></div>
  <div class="viewer-side">
    <div class="viewer-frame" id="viewerFrame">
      <div class="canvas" id="sharedCanvas"></div>
      <div class="viewer-toggle" id="viewerToggle">click to interact</div>
      <div class="legend">
        <div class="group">
          <div class="row"><span class="swatch truth"></span> truth</div>
          <div class="row"><span class="swatch pred"></span>  prediction</div>
        </div>
        <div class="group">
          <div class="row"><span class="swatch c-t"></span> C (truth)</div>
          <div class="row"><span class="swatch c-p"></span> C (pred)</div>
          <div class="row"><span class="swatch n"></span> N</div>
        </div>
      </div>
      <div class="controls" id="sharedControls">
        <button data-mode="stick">stick</button>
        <button class="active" data-mode="atoms">atoms</button>
      </div>
    </div>
  </div>
</div>

<main class="peptides" id="peptides"></main>

<section class="outro" id="outro"></section>

// ---- High-contrast by-element palette. Carbons differ between truth/pred. ----
const ELEM_TRUTH = { C: '#6f9c7a', N: '#3f5fa7', O: '#c2453a', S: '#c89a30', H: '#c8c4ba' };
const ELEM_PRED  = { C: '#b56a8a', N: '#3f5fa7', O: '#c2453a', S: '#c89a30', H: '#c8c4ba' };

const peptidesRoot = document.getElementById('peptides');
const stage = document.getElementById('stage');
const cardSide = document.getElementById('cardSide');
const navHint  = document.getElementById('navHint');

// Strip "[...]" and ", ..." tail from any title (titles in NAMES are already cleaned,
// but sequence fallbacks are safe and non-matching).
function cleanTitle(t) { return (t || '').replace(/\s*\[[^\]]*\]/g, '').replace(/\s*,.*$/, '').trim() || t; }

let SAMPLES = [];
let viewer = null;
let mode = 'atoms';
let currentIdx = -1;
let unlocked = false;

function boot() {
  const epoch = METRICS.epoch;
  const agg = METRICS.aggregate;
  SAMPLES = METRICS.samples.slice().sort((a, b) => a.rmsd - b.rmsd);

  document.title = `microfold · epoch ${epoch}`;
  document.getElementById('brand-epoch').innerHTML = `epoch <b>${epoch}</b>`;
  document.getElementById('hero-tagline').innerHTML =
    `Validation Set &middot; ${agg.n} peptides predicted from their sequences.<br>Visualization overlays predicted and experimental structures.`;
  document.getElementById('hero-agg').innerHTML = `
    <div class="stat"><div class="v">${agg.mean_rmsd.toFixed(2)} Å</div><div class="l">mean rmsd</div></div>
    <div class="stat"><div class="v">${agg.median_rmsd.toFixed(2)} Å</div><div class="l">median</div></div>
    <div class="stat"><div class="v">${agg.min_rmsd.toFixed(2)} Å</div><div class="l">best</div></div>
    <div class="stat"><div class="v">${agg.max_rmsd.toFixed(2)} Å</div><div class="l">worst</div></div>`;
  document.getElementById('outro').innerHTML =
    `microfold &middot; ESM-2 + IPA &middot; FAPE<hr>epoch ${epoch} &middot; ${agg.n} samples`;

  // One empty .peptide section per sample = one viewport-tall scroll slot.
  SAMPLES.forEach((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'peptide';
    sec.dataset.idx = i;
    peptidesRoot.appendChild(sec);
  });

  document.getElementById('loader').classList.add('gone');
  setTimeout(() => document.getElementById('loader').remove(), 500);
  setupViewer();
}

function ensureViewer() {
  if (viewer) return viewer;
  viewer = $3Dmol.createViewer(document.getElementById('sharedCanvas'), {
    backgroundColor: 0xf7f5ef, antialias: true,
  });
  return viewer;
}

function applyStyle(v) {
  v.setStyle({}, {});
  if (mode === 'stick') {
    // Just bonds, no spheres — element-coloured.
    v.setStyle({ model: 0 }, { stick: { radius: 0.10, colorfunc: a => ELEM_TRUTH[a.elem] || ELEM_TRUTH.C } });
    v.setStyle({ model: 1 }, { stick: { radius: 0.10, opacity: 0.85, colorfunc: a => ELEM_PRED[a.elem] || ELEM_PRED.C } });
  } else {
    // atoms: spheres on every atom, thin sticks for bonds.
    const fn0 = a => ELEM_TRUTH[a.elem] || ELEM_TRUTH.C;
    const fn1 = a => ELEM_PRED[a.elem]  || ELEM_PRED.C;
    v.setStyle({ model: 0 }, { stick: { radius: 0.07, colorfunc: fn0 }, sphere: { scale: 0.20, colorfunc: fn0 } });
    v.setStyle({ model: 1 }, { stick: { radius: 0.07, opacity: 0.85, colorfunc: fn1 }, sphere: { scale: 0.20, opacity: 0.85, colorfunc: fn1 } });
  }
}

function renderCard(s, i, n) {
  const name = cleanTitle(NAMES[s.id] || s.sequence);
  cardSide.innerHTML = `
    <div class="index"># ${String(i + 1).padStart(2,'0')} of ${n} &middot; DBAASP ${s.id}</div>
    <h2 class="title">${name}</h2>
    <div class="subtitle">${s.length} residues</div>
    <div class="metrics">
      <div class="metric rmsd"><span class="label">rmsd (Kabsch)</span><span class="value">${s.rmsd.toFixed(2)} Å</span></div>
      <div class="metric fape"><span class="label">total FAPE</span><span class="value">${s.total.toFixed(4)}</span></div>
      <div class="metric"><span class="label">intermediate</span><span class="value">${s.intermediate.toFixed(4)}</span></div>
      <div class="metric"><span class="label">final</span><span class="value">${s.final.toFixed(4)}</span></div>
    </div>
    <div class="seq-card">
      <div class="label">sequence</div>
      <div class="seq">${s.sequence}</div>
    </div>`;
}

function showSample(idx) {
  if (idx === currentIdx) return;
  currentIdx = idx;
  const s = SAMPLES[idx];
  renderCard(s, idx, SAMPLES.length);

  const data = PDBS[s.id];
  const v = ensureViewer();
  v.removeAllModels();
  v.addModel(data.truth, 'pdb');
  v.addModel(data.pred, 'pdb');
  applyStyle(v);
  v.zoomTo();
  // Pull back a bit more on narrow / portrait screens so the whole peptide fits.
  const isNarrow = window.matchMedia('(max-width: 900px), (orientation: portrait)').matches;
  v.zoom(isNarrow ? 0.85 : 1.10);
  if (!unlocked) v.spin('y', 0.3);
  v.render();

  // Alternate sides so adjacent peptides feel different.
  if (idx % 2 === 1) stage.classList.add('flip');
  else                stage.classList.remove('flip');
}

function setupViewer() {
  document.getElementById('sharedControls').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    e.stopPropagation();
    mode = e.target.dataset.mode;
    document.querySelectorAll('#sharedControls button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    if (viewer) { applyStyle(viewer); viewer.render(); }
  });

  const frame = document.getElementById('viewerFrame');
  const toggle = document.getElementById('viewerToggle');
  toggle.addEventListener('click', e => {
    e.stopPropagation();
    unlocked = !unlocked;
    if (unlocked) {
      frame.classList.add('unlocked');
      toggle.textContent = 'click to lock';
      if (viewer) { viewer.spin(false); viewer.render(); }
    } else {
      frame.classList.remove('unlocked');
      toggle.textContent = 'click to interact';
      if (viewer) { viewer.spin('y', 0.3); viewer.render(); }
    }
  });

  // Arrow-key navigation between peptides (also works on hero/outro: snap to next slot).
  window.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const slots = [document.querySelector('.hero'),
                   ...document.querySelectorAll('.peptide'),
                   document.getElementById('outro')];
    const vh = window.innerHeight;
    const center = vh / 2;
    let bestIdx = 0, bestDist = Infinity;
    slots.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const sc = r.top + r.height / 2;
      const d = Math.abs(sc - center);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = e.key === 'ArrowRight' ? Math.min(slots.length - 1, bestIdx + 1)
                                        : Math.max(0, bestIdx - 1);
    if (next !== bestIdx) {
      e.preventDefault();
      slots[next].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  startScrollLoop();
}

let raf = null;
function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function onScroll() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = null;
    const vh = window.innerHeight;
    const center = vh / 2;
    const sections = document.querySelectorAll('.peptide');
    if (!sections.length) return;

    let bestIdx = 0, bestDist = Infinity;
    for (let i = 0; i < sections.length; i++) {
      const r = sections[i].getBoundingClientRect();
      const sc = r.top + r.height / 2;
      const d = Math.abs(sc - center);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    if (bestIdx !== currentIdx) showSample(bestIdx);

    // Hide stage on the hero or outro; otherwise compute focus animation.
    const hero = document.querySelector('.hero');
    const outroEl = document.getElementById('outro');
    const hr = hero.getBoundingClientRect();
    const or = outroEl.getBoundingClientRect();
    const heroDominant  = hr.bottom > vh * 0.55;
    const outroDominant = or.top < vh * 0.45;
    if (heroDominant || outroDominant) {
      stage.classList.add('hidden');
      navHint.classList.remove('show');
      return;
    } else {
      stage.classList.remove('hidden');
      navHint.classList.add('show');
    }

    const norm = bestDist / (vh * 0.5);
    const SWEET = 0.30;
    let t;
    if (norm <= SWEET) t = 1;
    else t = 1 - easeInOutQuad(Math.min(1, (norm - SWEET) / (1 - SWEET)));

    if (!unlocked) {
      const scl  = (0.92 + 0.08 * t).toFixed(3);
      const opa  = (0.30 + 0.70 * t).toFixed(3);
      const ty   = ((1 - t) * 28).toFixed(1) + 'px';
      const blur = ((1 - t) * 4.5).toFixed(2) + 'px';
      stage.style.setProperty('--st-scl',  scl);
      stage.style.setProperty('--st-opa',  opa);
      stage.style.setProperty('--st-ty',   ty);
      stage.style.setProperty('--st-blur', blur);
    } else {
      stage.style.setProperty('--st-scl', '1');
      stage.style.setProperty('--st-opa', '1');
      stage.style.setProperty('--st-ty', '0px');
      stage.style.setProperty('--st-blur', '0px');
    }
  });
}

function startScrollLoop() {
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
}

boot();
</script>

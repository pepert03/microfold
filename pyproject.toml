[project]
name = "microfold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biotite>=1.6.0",
    "mp-nerf>=1.0.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "py3dmol>=2.5.4",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

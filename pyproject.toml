[project]
name = "microfold"
version = "0.1.0"
description = "Peptide folding prediction pipeline using geometric deep learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biotite>=1.6.0",
    "matplotlib>=3.9.0",
    "numpy>=2.4.4",
    "optuna>=4.0",
    "pandas>=3.0.2",
    "py3dmol>=2.5.4",
    "requests>=2.32.0",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microfold"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
